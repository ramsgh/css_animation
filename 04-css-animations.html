<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>04: CSS Keyframe Animations</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f8fafc;
      padding: 2rem;
    }

    .demo-group {
      display: flex;
      gap: 3rem;
      align-items: center;
      margin-top: 2rem;
    }

    /* 1. Define @keyframes */
    @keyframes pulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
      }
      70% {
        transform: scale(1.08);
        box-shadow: 0 0 0 15px rgba(239, 68, 68, 0);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
      }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes slideIn {
      0% { transform: translateX(-100px); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }

    /* 2. Applying Animation Properties */
    .pulse-badge {
      width: 80px;
      height: 80px;
      background: #ef4444;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;

      /* Full Animation Properties */
      animation-name: pulse;
      animation-duration: 1.8s;
      animation-timing-function: ease-in;
      animation-delay: 0s;
      animation-iteration-count: infinite;
      animation-direction: normal;
      animation-fill-mode: both;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #e2e8f0;
      border-top: 5px solid #3b82f6;
      border-radius: 50%;

      /* Animation Shorthand */
      animation: spin 1s linear infinite;
    }

    .slide-box {
      padding: 1rem 2rem;
      background: #10b981;
      color: white;
      border-radius: 8px;
      font-weight: bold;
      animation: slideIn 1.2s ease-out forwards;
    }
  </style>
</head>
<body>
  <h2>CSS @keyframes Animations</h2>

  <div class="demo-group">
    <div>
      <p>Pulse Badge</p>
      <div class="pulse-badge">LIVE</div>
    </div>

    <div>
      <p>Loading Spinner</p>
      <div class="spinner"></div>
    </div>

    <div>
      <p>Slide In Element</p>
      <div class="slide-box">Slide In On Load</div>
    </div>
  </div>
</body>
</html>
